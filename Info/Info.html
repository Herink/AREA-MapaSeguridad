<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
.card {
  box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
  max-width: 300px;
  margin: auto;
  text-align: center;
  font-family: arial;
}

.title {
  color: grey;
  font-size: 18px;
}

button {
  border: none;
  outline: 0;
  display: inline-block;
  padding: 8px;
  color: white;
  background-color: #000;
  text-align: center;
  cursor: pointer;
  width: 100%;
  font-size: 18px;
}

a {
  text-decoration: none;
  font-size: 22px;
  color: black;
}

button:hover, a:hover {
  opacity: 0.7;
}
.container {
  position: relative;
  width: 50%;
}

.image {
  display: block;
  width: 300px;
  height: 100%;
}

.overlay {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  height: 100%;
  width: 300px;
  opacity: 0;
  transition: .5s ease;
  background-color: #34BEA6;
}

.container:hover .overlay {
  opacity: 1;
}

.text {
  color: white;
  font-size: 20px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  -ms-transform: translate(-50%, -50%);
  text-align: center;
}
</style>
</head>
<body>
<body bgcolor="#FAFAF8">
<h2 style="text-align:center"></h2>

<div class="card">
  <div class="container">
  <img src="Icon.jpg" alt="Avatar" class="image">
  <div class="overlay">
    <div class="text">
      <p>Usuario: adminsecretaria</p>
    <p>Contraseña: 22321723</p>
  </div>
  </div>
  </div>
  <h1>C.P.C</h1>
  <p class="title">Coordinacion de Politica Criminal</p>
  <p class="title">Secretaria de Seguridad</p>

    <a href="#"><i class=" "></i></a>
    <a href="#"><i class=" "></i></a>
    <a href="#"><i class=" "></i></a>
 </div>
 <p><button>Municipalidad de Pinamar</button></p>
</div>

</body>
</html>
