<!DOCTYPE html>
<html>
  <head>
    <title>CPC</title>
    <script defer src="https://use.fontawesome.com/releases/v5.0.8/js/all.js"></script>


        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>

        * {box-sizing: border-box}
        body {font-family: "Lato", sans-serif;}
        html, body {
            height: 100%;
            width: 100%;
            overflow:hidden;

        }
        /* Style the tab */
        .tab {
            float: left;
            background-color: #202225;
            width: 5%;
            height: 100%;
        }

        /* Style the buttons inside the tab */
        .tab button {
            display: block;
            background-color: inherit;
            padding: 16px;
            width: 100%;
            border: none;
            outline: 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.5s ease;
            font-size: 200%;
            /*32px*/

        }

        /* Change background color of buttons on hover */
        .tab button:hover {
            background-color: #36393e;
        }

        /* Create an active/current "tab button" class */
        .tab button.active {
            background-color: #00D4CA;
        }

        /* Style the tab content */
        .tabcontent {
            float: left;
            padding: 0px 0px;
            border: 0px solid #ccc;
            width: 95%;
            border: none;
            border-bottom: none;
            height: 100%;
        }

        .fa-cog {
      color: black;
    }
    body {
        padding: 0;
        margin: 0;
    }


.closebtn:hover {
    color: #000;
}

        </style>
        </head>

        <body>
        <div class="tab">
      <button class="tablinks" onclick="openCity(event, '1')" id="defaultOpen"><a href="#"><i class="fas fa-map-marker-alt" style="color: #ECEFF2 "></i></a></button>
      <button class="tablinks" onclick="openCity(event, '2')"><font color="red"><a href="#"><i class="fas fa-eye" style="color: #ECEFF2"></i></a></font></button>
      <button class="tablinks" onclick="openCity(event, '3')"><a href="#"><i class="fas fa-chart-pie" style="color: #ECEFF2"></i></a></button>
      <button class="tablinks" onclick="openCity(event, '4')"><a href="#"><i class="fas fa-taxi" style="color: #ECEFF2"></i></a></button>
      <button class="tablinks" onclick="openCity(event, '5')"><a href="#"><i class="fas fa-address-book" style="color: #ECEFF2"></i></a></button>
      <button class="tablinks" onclick="openCity(event, '6')"><a href="#"><i class="fas fa-info-circle" style="color: #ECEFF2"></i></a></button>
</div>
      <div id="1" class="tabcontent">
<iframe src="./mapas/Mapa delictivo.html" width="100%" height="100%"></iframe>
      </div>

      <div id="2" class="tabcontent">
      <iframe src="./mapas/camaras.html" width="100%" height="100%"></iframe>
      </div>
      <div id="3" class="tabcontent">
<iframe src="./Estadisticas/gabril.html" frameborder="0" width="100%" height="100%"></iframe>
      </div>
      <div id="4" class="tabcontent">
      <iframe src="http://aerius1.dyndns.org:8888/" frameborder="0" width="100%" height="100%"></iframe>
</div>
<div id="5" class="tabcontent">
  <iframe src="https://drive.google.com/embeddedfolderview?id=1cj94WukYnmKf8ryG8CXnFeQeVOD73-cn#grid" width="100%" height="100%" frameborder="0"></iframe>
</div>
<div id="6" class="tabcontent">
<iframe src="./Info/Info.html" frameborder="0" width="100%" height="100%"></iframe>
</div>
      <script>
      function openCity(evt, cityName) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tabcontent");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
        }
        tablinks = document.getElementsByClassName("tablinks");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
        document.getElementById(cityName).style.display = "block";
        evt.currentTarget.className += " active";
      }

      // Get the element with id="defaultOpen" and click on it
      document.getElementById("defaultOpen").click();
      </script>

      </body>
    </html>
